method: ein_seld
dataset: dcase2020task3
workspace_dir: ./
dataset_dir: ../dataset_root
hdf5_dir: ./_hdf5
velocity_hdf5_dir: ./velocity_hdf5/dcase2020task3/velocity
data:
  type: foa
  sample_rate: 24000
  n_fft: 1024
  hop_length: 600
  n_mels: 256
  window: hann
  fmin: 20
  fmax: 12000
  train_chunklen_sec: 4
  train_hoplen_sec: 4
  test_chunklen_sec: 4
  test_hoplen_sec: 4
  audio_feature: logmel&intensity
  feature_freeze: true
  legacy_foa_iv_order: true
data_augmentation:
  type: None
training:
  train_id: E1_OfflineEINV2_Velocity_seed2026
  model: OfflineEINV2Velocity
  resume_model:
  loss_type: all
  loss_beta: 0.5
  lambda_velocity: 0.2
  PIT_type: tPIT
  batch_size: 32
  train_fold: 2,3,4,5,6
  valid_fold: 1
  overlap: 1&2
  optimizer: adam
  lr: 0.0005
  lr_step_size: 80
  lr_gamma: 0.1
  max_epoch: 90
  threshold_sed: 0.5
  remark: rabbit02_gpu4_e1
inference:
  infer_id: E1_OfflineEINV2_Velocity_seed2026
  testset_type: dev
  test_fold: 1
  overlap: 1&2
  train_ids: E1_OfflineEINV2_Velocity_seed2026
  models: OfflineEINV2Velocity
  batch_size: 64
  threshold_sed: 0.5
  remark: rabbit02_gpu4_e1
