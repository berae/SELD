method: ein_seld
dataset: dcase2020task3
workspace_dir: ./
dataset_dir: ../dataset_root
hdf5_dir: ./_hdf5
jepa_hdf5_dir: ./jepa_hdf5/dcase2020task3/jepa
velocity_hdf5_dir: ./velocity_hdf5/dcase2020task3/velocity
causal_scalar_path: ./_hdf5/dcase2020task3/scalar/foa_causal_logmel&intensity_sr24000_nfft1024_hop600_mel256.h5
data:
  type: foa
  sample_rate: 24000
  n_fft: 1024
  hop_length: 600
  n_mels: 256
  window: hann
  fmin: 20
  fmax: 12000
  train_chunklen_sec: 4
  train_hoplen_sec: 4
  test_chunklen_sec: 4
  test_hoplen_sec: 4
  audio_feature: causal_logmel&intensity
  feature_freeze: True
  foa_iv_acn_reorder: True
data_augmentation:
  type: None
training:
  train_id: C3_CausalEINV2_Velocity_JEPA_seed2026
  model: CausalEINV2VelocityJEPA
  resume_model:
  loss_type: all
  loss_beta: 0.5
  lambda_velocity: 0.2
  lambda_jepa: 0.2
  jepa_ema_momentum: 0.996
  jepa_latent_dim: 128
  jepa_predictor_hidden_dim: 256
  jepa_horizons_frames: [1, 3, 5]
  PIT_type: tPIT
  batch_size: 32
  train_fold: 2,3,4,5,6
  valid_fold: 1
  overlap: 1&2
  optimizer: adam
  lr: 0.0005
  lr_step_size: 80
  lr_gamma: 0.1
  max_epoch: 90
  threshold_sed: 0.5
  remark: rabbit02_gpu4_c3
inference:
  infer_id: C3_CausalEINV2_Velocity_JEPA_seed2026
  testset_type: dev
  test_fold: 1
  overlap: 1&2
  train_ids: C3_CausalEINV2_Velocity_JEPA_seed2026
  models: CausalEINV2VelocityJEPA
  batch_size: 64
  threshold_sed: 0.5
  remark: rabbit02_gpu4_c3
