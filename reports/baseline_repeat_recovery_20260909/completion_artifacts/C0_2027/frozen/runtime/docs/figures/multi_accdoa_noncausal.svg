<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="810" viewBox="0 0 1400 810" role="img" aria-labelledby="title desc">
<title id="title">Multi-ACCDOA · noncausal</title><desc id="desc">A0 baseline；A1 + velocity；A2 + latent；A3 联合。各变体共用 SeldModel，通过 flags 启用辅助 loss。</desc>
<defs><marker id="arrow-main" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L9,4.5 L0,9 Z" fill="#2463a6"/></marker><marker id="arrow-aux" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L9,4.5 L0,9 Z" fill="#986018"/></marker><marker id="arrow-target" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L9,4.5 L0,9 Z" fill="#23775c"/></marker><marker id="arrow-plain" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L9,4.5 L0,9 Z" fill="#52637a"/></marker></defs>
<style>text{font-family:"Segoe UI","Microsoft YaHei","Noto Sans CJK SC",Arial,sans-serif;fill:#172b4d} .small{fill:#52637a}</style>
<rect width="1400" height="810" fill="white"/>
<text x="36" y="43" font-size="27" text-anchor="start" style="fill:#172b4d;font-weight:600">Multi-ACCDOA · noncausal</text>
<text x="36" y="78" font-size="16" text-anchor="start" style="fill:#52637a;font-weight:400">A0 baseline；A1 + velocity；A2 + latent；A3 联合。各变体共用 SeldModel，通过 flags 启用辅助 loss。</text>
<path d="M36 98 H1364" stroke="#d8e1eb"/>
<g data-node-group="true">
<rect data-node="true" x="36" y="165" width="166" height="145" rx="9" fill="#edf4fc" stroke="#2463a6" stroke-width="1.6"/>
<text x="119.0" y="205.1" font-size="15" text-anchor="middle" style="fill:#172b4d;font-weight:600">FOA features</text>
<text x="119.0" y="230.1" font-size="15" text-anchor="middle" style="fill:#172b4d;font-weight:400">B × 7 × 250 × 64</text>
<text x="119.0" y="255.1" font-size="15" text-anchor="middle" style="fill:#172b4d;font-weight:400">4 log-mel + 3 IV</text>
<text x="119.0" y="280.1" font-size="15" text-anchor="middle" style="fill:#172b4d;font-weight:400">5 s / hop 20 ms</text>
</g>
<g data-node-group="true">
<rect data-node="true" x="240" y="142" width="214" height="191" rx="9" fill="#edf4fc" stroke="#2463a6" stroke-width="1.6"/>
<text x="347.0" y="167.6" font-size="15" text-anchor="middle" style="fill:#172b4d;font-weight:600">CNN × 3 stages</text>
<text x="347.0" y="192.6" font-size="15" text-anchor="middle" style="fill:#172b4d;font-weight:400">symmetric Conv3×3</text>
<text x="347.0" y="217.6" font-size="15" text-anchor="middle" style="fill:#172b4d;font-weight:400">BatchNorm2d + ReLU</text>
<text x="347.0" y="242.6" font-size="15" text-anchor="middle" style="fill:#172b4d;font-weight:400">MaxPool + Dropout2d</text>
<text x="347.0" y="267.6" font-size="15" text-anchor="middle" style="fill:#172b4d;font-weight:400">channels: 64 / 64 / 64</text>
<text x="347.0" y="292.6" font-size="15" text-anchor="middle" style="fill:#172b4d;font-weight:400">t-pool: 5 / 1 / 1</text>
<text x="347.0" y="317.6" font-size="15" text-anchor="middle" style="fill:#172b4d;font-weight:400">f-pool: 4 / 4 / 2</text>
</g>
<g data-node-group="true">
<rect data-node="true" x="492" y="185" width="156" height="105" rx="9" fill="#edf4fc" stroke="#2463a6" stroke-width="1.6"/>
<text x="570.0" y="217.6" font-size="15" text-anchor="middle" style="fill:#172b4d;font-weight:600">Reshape</text>
<text x="570.0" y="242.6" font-size="15" text-anchor="middle" style="fill:#172b4d;font-weight:400">B × 64 × 50 × 2</text>
<text x="570.0" y="267.6" font-size="15" text-anchor="middle" style="fill:#172b4d;font-weight:400">→ B × 50 × 128</text>
</g>
<g data-node-group="true">
<rect data-node="true" x="686" y="165" width="184" height="145" rx="9" fill="#edf4fc" stroke="#2463a6" stroke-width="1.6"/>
<text x="778.0" y="205.1" font-size="15" text-anchor="middle" style="fill:#172b4d;font-weight:600">BiGRU × 2 layers</text>
<text x="778.0" y="230.1" font-size="15" text-anchor="middle" style="fill:#172b4d;font-weight:400">128 per direction</text>
<text x="778.0" y="255.1" font-size="15" text-anchor="middle" style="fill:#172b4d;font-weight:400">tanh → [fwd,bwd]</text>
<text x="778.0" y="280.1" font-size="15" text-anchor="middle" style="fill:#172b4d;font-weight:400">fwd ⊙ bwd → 128</text>
</g>
<g data-node-group="true">
<rect data-node="true" x="908" y="165" width="192" height="145" rx="9" fill="#edf4fc" stroke="#2463a6" stroke-width="1.6"/>
<text x="1004.0" y="205.1" font-size="15" text-anchor="middle" style="fill:#172b4d;font-weight:600">MHSA × 2 layers</text>
<text x="1004.0" y="230.1" font-size="15" text-anchor="middle" style="fill:#172b4d;font-weight:400">d=128, heads=8</text>
<text x="1004.0" y="255.1" font-size="15" text-anchor="middle" style="fill:#172b4d;font-weight:400">residual + LayerNorm</text>
<text x="1004.0" y="280.1" font-size="15" text-anchor="middle" style="fill:#172b4d;font-weight:400">no attention mask</text>
</g>
<g data-node-group="true">
<rect data-node="true" x="1138" y="165" width="226" height="145" rx="9" fill="#edf4fc" stroke="#2463a6" stroke-width="1.6"/>
<text x="1251.0" y="205.1" font-size="15" text-anchor="middle" style="fill:#172b4d;font-weight:600">ACCDOA head</text>
<text x="1251.0" y="230.1" font-size="15" text-anchor="middle" style="fill:#172b4d;font-weight:400">Linear 128 → 128 → 126</text>
<text x="1251.0" y="255.1" font-size="15" text-anchor="middle" style="fill:#172b4d;font-weight:400">最后 tanh</text>
<text x="1251.0" y="280.1" font-size="15" text-anchor="middle" style="fill:#172b4d;font-weight:400">无隐藏层激活</text>
</g>
<polyline points="202,237 240,237" fill="none" stroke="#2463a6" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow-main)"/>
<polyline points="454,237 492,237" fill="none" stroke="#2463a6" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow-main)"/>
<polyline points="648,237 686,237" fill="none" stroke="#2463a6" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow-main)"/>
<polyline points="870,237 908,237" fill="none" stroke="#2463a6" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow-main)"/>
<polyline points="1100,237 1138,237" fill="none" stroke="#2463a6" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow-main)"/>
<g data-node-group="true">
<rect data-node="true" x="1119" y="365" width="245" height="129" rx="9" fill="#edf4fc" stroke="#2463a6" stroke-width="1.6"/>
<text x="1241.5" y="398.26" font-size="14" text-anchor="middle" style="fill:#172b4d;font-weight:600">Multi-ACCDOA output</text>
<text x="1241.5" y="422.26" font-size="14" text-anchor="middle" style="fill:#172b4d;font-weight:400">B × 50 × 126</text>
<text x="1241.5" y="446.26" font-size="14" text-anchor="middle" style="fill:#172b4d;font-weight:400">= 3 tracks × xyz × 14 classes</text>
<text x="1241.5" y="470.26" font-size="14" text-anchor="middle" style="fill:#172b4d;font-weight:400">向量范数: activity；方向: DOA</text>
</g>
<polyline points="1251,310 1251,365" fill="none" stroke="#2463a6" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow-main)"/>
<g data-node-group="true">
<rect data-node="true" x="502" y="451" width="270" height="120" rx="9" fill="#fff5e5" stroke="#986018" stroke-width="1.6" stroke-dasharray="7 5"/>
<text x="637.0" y="478.6" font-size="15" text-anchor="middle" style="fill:#172b4d;font-weight:600">Velocity · A1 / A3</text>
<text x="637.0" y="503.6" font-size="15" text-anchor="middle" style="fill:#172b4d;font-weight:400">Linear 128 → 126</text>
<text x="637.0" y="528.6" font-size="15" text-anchor="middle" style="fill:#172b4d;font-weight:400">B × 50 × 3 × 14 × 3</text>
<text x="637.0" y="553.6" font-size="15" text-anchor="middle" style="fill:#172b4d;font-weight:400">masked Smooth L1</text>
</g>
<g data-node-group="true">
<rect data-node="true" x="812" y="451" width="270" height="120" rx="9" fill="#fff5e5" stroke="#986018" stroke-width="1.6" stroke-dasharray="7 5"/>
<text x="947.0" y="478.6" font-size="15" text-anchor="middle" style="fill:#172b4d;font-weight:600">Latent · A2 / A3</text>
<text x="947.0" y="503.6" font-size="15" text-anchor="middle" style="fill:#172b4d;font-weight:400">Linear → 3 × 14 × 128</text>
<text x="947.0" y="528.6" font-size="15" text-anchor="middle" style="fill:#172b4d;font-weight:400">L2 normalize + predictor</text>
<text x="947.0" y="553.6" font-size="15" text-anchor="middle" style="fill:#172b4d;font-weight:400">MLP 129 → 256 → 128</text>
</g>
<polyline points="1004,310 1004,390 637,390 637,451" fill="none" stroke="#986018" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow-aux)" stroke-dasharray="7 5"/>
<polyline points="1004,390 947,390 947,451" fill="none" stroke="#986018" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow-aux)" stroke-dasharray="7 5"/>
<text x="675" y="373" font-size="15" text-anchor="start" style="fill:#52637a;font-weight:400">shared representation h: B × 50 × 128</text>
<g data-node-group="true">
<rect data-node="true" x="36" y="429" width="405" height="148" rx="9" fill="#f6f8fb" stroke="#8593a5" stroke-width="1.6"/>
<text x="238.5" y="470.6" font-size="15" text-anchor="middle" style="fill:#172b4d;font-weight:600">主监督: ADPIT MSE</text>
<text x="238.5" y="495.6" font-size="15" text-anchor="middle" style="fill:#172b4d;font-weight:400">13 个候选 target；逐 frame / class 选最小</text>
<text x="238.5" y="520.6" font-size="15" text-anchor="middle" style="fill:#172b4d;font-weight:400">3 output tracks ≠ 3 个固定声源身份</text>
<text x="238.5" y="545.6" font-size="15" text-anchor="middle" style="fill:#172b4d;font-weight:400">辅助 mask 来自同一 ADPIT assignment</text>
</g>
<text x="38" y="640" font-size="16" text-anchor="start" style="fill:#172b4d;font-weight:400">当前 paper A/C configs 均使用 strict-causal frontend + train-fold-only normalization；A 模型仍是非因果 backbone。</text>
<text x="38" y="674" font-size="16" text-anchor="start" style="fill:#172b4d;font-weight:400">CNN dropout=0.05；GRU dropout=0.05；MHSA dropout=0.05。C 模型的 BatchNorm 训练统计跨时间聚合。</text>
<text x="36" y="725" font-size="15" text-anchor="start" style="fill:#52637a;font-weight:400">蓝色：主预测路径；橙色虚线：可选辅助分支，SELD 解码不依赖 auxiliary outputs / teacher。</text>
<text x="36" y="750" font-size="15" text-anchor="start" style="fill:#52637a;font-weight:400">两类辅助 head 总会实例化；disabled 时冻结并跳过对应输出。非因果 latent loss 是 consistency，不宣称无 look-ahead。</text>
<text x="36" y="775" font-size="15" text-anchor="start" style="fill:#52637a;font-weight:400">Causal 描述推理结构，不等于严格逐帧训练因果性或已验证零时延。</text>
</svg>
