<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="790" viewBox="0 0 1400 790" role="img" aria-labelledby="title desc">
<title id="title">方法示意 · velocity supervision</title><desc id="desc">辅助 head 预测单位方向向量的变化率，不是以 m/s 为单位的真实空间速度；Δt = 0.1 s。</desc>
<defs><marker id="arrow-main" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L9,4.5 L0,9 Z" fill="#2463a6"/></marker><marker id="arrow-aux" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L9,4.5 L0,9 Z" fill="#986018"/></marker><marker id="arrow-target" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L9,4.5 L0,9 Z" fill="#23775c"/></marker><marker id="arrow-plain" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L9,4.5 L0,9 Z" fill="#52637a"/></marker></defs>
<style>text{font-family:"Segoe UI","Microsoft YaHei","Noto Sans CJK SC",Arial,sans-serif;fill:#172b4d} .small{fill:#52637a}</style>
<rect width="1400" height="790" fill="white"/>
<text x="36" y="43" font-size="27" text-anchor="start" style="fill:#172b4d;font-weight:600">方法示意 · velocity supervision</text>
<text x="36" y="78" font-size="16" text-anchor="start" style="fill:#52637a;font-weight:400">辅助 head 预测单位方向向量的变化率，不是以 m/s 为单位的真实空间速度；Δt = 0.1 s。</text>
<path d="M36 98 H1364" stroke="#d8e1eb"/>
<text x="36" y="141" font-size="22" text-anchor="start" style="fill:#172b4d;font-weight:600">EINV2 · C1 / C3 / E1 / E3</text>
<g data-node-group="true">
<rect data-node="true" x="36" y="184" width="272" height="132" rx="9" fill="#f6f8fb" stroke="#8593a5" stroke-width="1.6"/>
<text x="172.0" y="216.44" font-size="16" text-anchor="middle" style="fill:#172b4d;font-weight:600">GT metadata + DOA labels</text>
<text x="172.0" y="242.44" font-size="16" text-anchor="middle" style="fill:#172b4d;font-weight:400">identity = (class, source ID)</text>
<text x="172.0" y="268.44" font-size="16" text-anchor="middle" style="fill:#172b4d;font-weight:400">匹配到 2 个内部 track slots</text>
<text x="172.0" y="294.44" font-size="16" text-anchor="middle" style="fill:#172b4d;font-weight:400">p 为 xyz 单位方向</text>
</g>
<g data-node-group="true">
<rect data-node="true" x="354" y="184" width="298" height="132" rx="9" fill="#f6f8fb" stroke="#8593a5" stroke-width="1.6"/>
<text x="503.0" y="216.44" font-size="16" text-anchor="middle" style="fill:#172b4d;font-weight:600">有效相邻帧</text>
<text x="503.0" y="242.44" font-size="16" text-anchor="middle" style="fill:#172b4d;font-weight:400">同一内部 slot 的 identity 相同</text>
<text x="503.0" y="268.44" font-size="16" text-anchor="middle" style="fill:#172b4d;font-weight:400">vₜ = (pₜ − pₜ₋₁) / 0.1</text>
<text x="503.0" y="294.44" font-size="16" text-anchor="middle" style="fill:#172b4d;font-weight:400">首帧 / 不连续处不计 loss</text>
</g>
<g data-node-group="true">
<rect data-node="true" x="698" y="184" width="279" height="132" rx="9" fill="#fff5e5" stroke="#986018" stroke-width="1.6" stroke-dasharray="7 5"/>
<text x="837.5" y="216.44" font-size="16" text-anchor="middle" style="fill:#172b4d;font-weight:600">tPIT 对齐</text>
<text x="837.5" y="242.44" font-size="16" text-anchor="middle" style="fill:#172b4d;font-weight:400">沿主 SED + DOA 的置换</text>
<text x="837.5" y="268.44" font-size="16" text-anchor="middle" style="fill:#172b4d;font-weight:400">对 velocity target / mask</text>
<text x="837.5" y="294.44" font-size="16" text-anchor="middle" style="fill:#172b4d;font-weight:400">同步交换 track slots</text>
</g>
<g data-node-group="true">
<rect data-node="true" x="1023" y="184" width="341" height="132" rx="9" fill="#fff5e5" stroke="#986018" stroke-width="1.6" stroke-dasharray="7 5"/>
<text x="1193.5" y="216.44" font-size="16" text-anchor="middle" style="fill:#172b4d;font-weight:600">masked Smooth L1</text>
<text x="1193.5" y="242.44" font-size="16" text-anchor="middle" style="fill:#172b4d;font-weight:400">DOA track features → Linear → v̂ₜ</text>
<text x="1193.5" y="268.44" font-size="16" text-anchor="middle" style="fill:#172b4d;font-weight:400">仅 valid mask 上平均</text>
<text x="1193.5" y="294.44" font-size="16" text-anchor="middle" style="fill:#172b4d;font-weight:400">λᵥ = 0.2</text>
</g>
<polyline points="308,250 354,250" fill="none" stroke="#986018" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow-aux)" stroke-dasharray="7 5"/>
<polyline points="652,250 698,250" fill="none" stroke="#986018" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow-aux)" stroke-dasharray="7 5"/>
<polyline points="977,250 1023,250" fill="none" stroke="#986018" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow-aux)" stroke-dasharray="7 5"/>
<text x="36" y="399" font-size="22" text-anchor="start" style="fill:#172b4d;font-weight:600">Multi-ACCDOA · C1 / C3 / A1 / A3</text>
<g data-node-group="true">
<rect data-node="true" x="36" y="442" width="272" height="132" rx="9" fill="#f6f8fb" stroke="#8593a5" stroke-width="1.6"/>
<text x="172.0" y="474.44" font-size="16" text-anchor="middle" style="fill:#172b4d;font-weight:600">ADPIT 主 loss</text>
<text x="172.0" y="500.44" font-size="16" text-anchor="middle" style="fill:#172b4d;font-weight:400">13 个候选逐 frame / class</text>
<text x="172.0" y="526.44" font-size="16" text-anchor="middle" style="fill:#172b4d;font-weight:400">选择 aligned ACCDOA target</text>
<text x="172.0" y="552.44" font-size="16" text-anchor="middle" style="fill:#172b4d;font-weight:400">以及 assignment ID</text>
</g>
<g data-node-group="true">
<rect data-node="true" x="354" y="442" width="298" height="132" rx="9" fill="#f6f8fb" stroke="#8593a5" stroke-width="1.6"/>
<text x="503.0" y="474.44" font-size="16" text-anchor="middle" style="fill:#172b4d;font-weight:600">有效相邻帧</text>
<text x="503.0" y="500.44" font-size="16" text-anchor="middle" style="fill:#172b4d;font-weight:400">两端 activity &gt; 0.5</text>
<text x="503.0" y="526.44" font-size="16" text-anchor="middle" style="fill:#172b4d;font-weight:400">两端 assignment ID 相同</text>
<text x="503.0" y="552.44" font-size="16" text-anchor="middle" style="fill:#172b4d;font-weight:400">不是 source identity 检查</text>
</g>
<g data-node-group="true">
<rect data-node="true" x="698" y="442" width="279" height="132" rx="9" fill="#fff5e5" stroke="#986018" stroke-width="1.6" stroke-dasharray="7 5"/>
<text x="837.5" y="474.44" font-size="16" text-anchor="middle" style="fill:#172b4d;font-weight:600">方向变化 target</text>
<text x="837.5" y="500.44" font-size="16" text-anchor="middle" style="fill:#172b4d;font-weight:400">vₜ = (p̃ₜ − p̃ₜ₋₁) / 0.1</text>
<text x="837.5" y="526.44" font-size="16" text-anchor="middle" style="fill:#172b4d;font-weight:400">p̃: ADPIT-aligned target</text>
<text x="837.5" y="552.44" font-size="16" text-anchor="middle" style="fill:#172b4d;font-weight:400">维度: track × class × xyz</text>
</g>
<g data-node-group="true">
<rect data-node="true" x="1023" y="442" width="341" height="132" rx="9" fill="#fff5e5" stroke="#986018" stroke-width="1.6" stroke-dasharray="7 5"/>
<text x="1193.5" y="474.44" font-size="16" text-anchor="middle" style="fill:#172b4d;font-weight:600">masked Smooth L1</text>
<text x="1193.5" y="500.44" font-size="16" text-anchor="middle" style="fill:#172b4d;font-weight:400">shared h → Linear → v̂ₜ</text>
<text x="1193.5" y="526.44" font-size="16" text-anchor="middle" style="fill:#172b4d;font-weight:400">仅 valid mask 上平均</text>
<text x="1193.5" y="552.44" font-size="16" text-anchor="middle" style="fill:#172b4d;font-weight:400">当前 λᵥ = 0.05</text>
</g>
<polyline points="308,508 354,508" fill="none" stroke="#986018" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow-aux)" stroke-dasharray="7 5"/>
<polyline points="652,508 698,508" fill="none" stroke="#986018" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow-aux)" stroke-dasharray="7 5"/>
<polyline points="977,508 1023,508" fill="none" stroke="#986018" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow-aux)" stroke-dasharray="7 5"/>
<text x="36" y="644" font-size="20" text-anchor="start" style="fill:#172b4d;font-weight:400">EINV2: L = 0.5 L_SED + 0.5 L_DOA + λᵥ L_velocity + λⱼ L_latent</text>
<text x="36" y="682" font-size="20" text-anchor="start" style="fill:#172b4d;font-weight:400">Multi-ACCDOA: L = L_ADPIT + λᵥ L_velocity + λⱼ L_latent</text>
<text x="36" y="730" font-size="15" text-anchor="start" style="fill:#52637a;font-weight:400">本图只描述实际实现：未加入轨迹积分、预测位置外推或额外 inference smoothing。</text>
<text x="36" y="755" font-size="15" text-anchor="start" style="fill:#52637a;font-weight:400">禁用的辅助项不参与总 loss；静态 source 的有效相邻帧也可产生零 velocity target，并非只监督动态 source。</text>
</svg>
